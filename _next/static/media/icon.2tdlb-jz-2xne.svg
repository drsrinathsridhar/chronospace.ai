<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <style>
    /* No background: the tab strip shows through. The mark is c-black so it reads on
       the light chrome most browsers default to, and flips to white when the browser
       reports a dark theme. Browsers without SVG-favicon support fall back to
       favicon.ico, which cannot carry a media query and so ships the c-black mark. */
    path { fill: #090b19; }
    @media (prefers-color-scheme: dark) {
      path { fill: #ffffff; }
    }
  </style>
